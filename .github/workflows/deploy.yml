name: Deploy Frontend to GitHub Pages

on:
  # يقوم بتشغيل الأكشن عند أي تحديث في فرع main
  push:
    branches: ["main"]
  # يتيح لك تشغيل الأكشن يدوياً إذا أردت
  workflow_dispatch:

# إعطاء الصلاحيات اللازمة للأكشن لرفع الملفات
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # هذا هو السطر الأهم: يوجه الأكشن لأخذ ملفات مجلد frontend فقط
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
